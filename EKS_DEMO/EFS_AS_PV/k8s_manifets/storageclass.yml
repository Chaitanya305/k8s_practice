apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-0ff249b567a034fb4
  directoryPerms: "700"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete   #if sc is delete pv will also get deleted.
